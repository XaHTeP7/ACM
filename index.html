<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACM — AI Core Mixes</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
    --copper:#e05a1d;
    --copper-glow:rgba(224, 90, 29, 0.4);
    --bg:#07080a;
    --card:rgba(255,255,255,.03);
    --card-hover:rgba(255,255,255,.06);
    --text:#ffffff;
    --text-dim:#7e8895;
}

body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:var(--text);
    min-height:100vh;
    background:var(--bg);
    background-image:url("acm_logo.png");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(5, 6, 8, 0.92);
    z-index:-1;
}

.wrap{
    max-width:960px;
    margin:0 auto;
    padding:40px 20px;
}

.logo{
    display:block;
    width:min(280px,70%);
    margin:0 auto 30px;
    opacity:0.9;
}

/* ===== О ПРОЕКТЕ & КНОПКИ-РАЗДЕЛИТЕЛИ С ЛИНИЯМИ ===== */
.about-section{margin-bottom:30px}

.about-toggle,
.genre-section summary {
    width: 100%;
    padding: 10px 0;
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--copper);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    transition: color 0.3s, text-shadow 0.3s;
    list-style: none;
}

.genre-section summary::-webkit-details-marker { display: none; }

.about-toggle:hover,
.genre-section summary:hover {
    color: #ff773d;
    text-shadow: 0 0 10px var(--copper-glow);
}

/* Линии слева и справа */
.about-toggle::before,
.about-toggle::after,
.genre-section summary::before,
.genre-section summary::after {
    content: "";
    flex: 1;
    height: 2px;
    pointer-events: none;
}

/* Левая полоса (сужается и угасает влево) */
.about-toggle::before,
.genre-section summary::before {
    background: linear-gradient(to left, rgba(224, 90, 29, 0.8), rgba(224, 90, 29, 0));
    clip-path: polygon(0 50%, 100% 0, 100% 100%);
}

/* Правая полоса (сужается и угасает вправо) */
.about-toggle::after,
.genre-section summary::after {
    background: linear-gradient(to right, rgba(224, 90, 29, 0.8), rgba(224, 90, 29, 0));
    clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* Стрелки-указатели */
.about-toggle span::after,
.genre-section summary span::after {
    content: "▼";
    display: inline-block;
    margin-left: 8px;
    font-size: 8px;
    transition: transform 0.3s;
}

.about-section[open] .about-toggle span::after,
.genre-section details[open] summary span::after {
    transform: rotate(180deg);
}

.about-content{
    margin-top:12px;
    padding:18px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    font-size:13px;
    line-height:1.7;
    color:var(--text-dim);
}

.about-content p{margin-bottom:8px}
.about-content p:last-child{margin-bottom:0}

/* =========================================================
   ACM PLAYER
   ========================================================= */

.player-card{
    position:relative;
    background:radial-gradient(ellipse at center, #12151b 0%, #08090c 100%);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:35px;
    margin-bottom:40px;
    box-shadow:0 30px 60px rgba(0,0,0,.7);
    display:grid;
    grid-template-columns:260px 1fr;
    gap:40px;
    align-items:center;
}

.status-badge{
    position:absolute;
    top:20px;
    right:25px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    letter-spacing:2px;
    color:#5a6370;
    font-weight:600;
}

.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#e05a1d;
    box-shadow:0 0 8px var(--copper);
}

.player-card.is-playing .status-dot{
    animation:blink 1.2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.4; box-shadow:0 0 2px var(--copper);}
    to{opacity:1; box-shadow:0 0 10px var(--copper);}
}

.cover-wrapper{
    position:relative;
    width:260px;
    height:260px;
    border-radius:6px;
}

.cover-image{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
    border:1px solid rgba(255,255,255,0.1);
}

.cover-wrapper::after{
    content:"";
    position:absolute;
    inset:-15px;
    background:radial-gradient(circle, rgba(224,90,29,0.2) 0%, transparent 70%);
    z-index:-1;
    pointer-events:none;
    filter:blur(10px);
}

.player-details{
    display:flex;
    flex-direction:column;
}

.track-category{
    font-size:11px;
    letter-spacing:2px;
    color:#4e5765;
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
}

.track-title{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
    margin-bottom:8px;
    line-height:1.1;
}

.track-meta-tags{
    display:flex;
    gap:12px;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--copper);
    text-transform:uppercase;
    margin-bottom:30px;
    font-weight:600;
}

.waveform-container{
    position:relative;
    width:100%;
    height:60px;
    margin-bottom:12px;
    cursor:pointer;
}

#wave-canvas{
    width:100%;
    height:100%;
    display:block;
}

.time-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#4e5765;
    font-family:monospace;
    margin-bottom:25px;
}

.controls-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

.ctrl-btn{
    background:none;
    border:none;
    color:#4e5765;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color 0.2s, transform 0.1s;
    outline:none;
}

.ctrl-btn:hover{color:#fff}
.ctrl-btn.active{color:var(--copper)}

.ctrl-btn svg{
    width:18px;
    height:18px;
    fill:currentColor;
}

.btn-play-wrap{
    position:relative;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.play-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--copper);
    box-shadow:0 0 12px var(--copper-glow);
    pointer-events:none;
}

.ctrl-btn-play{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#161920;
    border:1px solid rgba(255,255,255,0.1);
    color:#fff;
}

.ctrl-btn-play:hover{
    background:#202530;
    color:var(--copper);
    transform:scale(1.05);
}

.ctrl-btn-play svg{
    width:20px;
    height:20px;
    fill:currentColor;
}

.volume-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    color:#3a424e;
}

.volume-row svg{
    width:14px;
    height:14px;
    fill:currentColor;
}

.volume-slider{
    width:70px;
    height:2px;
    appearance:none;
    -webkit-appearance:none;
    background:#202530;
    outline:none;
    border-radius:2px;
}

.volume-slider::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:8px;
    height:8px;
    background:var(--copper);
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 6px var(--copper);
}

/* ===== ПЛЕЙЛИСТЫ ===== */
.playlists{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:40px;
}

.genre-section summary{
    margin-bottom:12px;
}

.track-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.track-item{
    display:flex;
    align-items:center;
    padding:10px 14px;
    background:var(--card);
    border-radius:6px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:.2s;
}

.track-item:hover{
    background:var(--card-hover);
    transform:translateX(4px);
}

.track-item.active{
    background:rgba(224,90,29,.1);
    border-left-color:var(--copper);
}

.track-item-name{
    flex:1;
    font-weight:600;
    font-size:12px;
}

.track-item-meta{
    font-size:10px;
    color:var(--text-dim);
}

/* ===== ФУТЕР ===== */
.footer{
    text-align:center;
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.05);
}

.social-links{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:15px;
}

.social-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 16px;
    background:var(--card);
    border:1px solid rgba(224,90,29,.25);
    border-radius:20px;
    color:var(--text);
    text-decoration:none;
    transition:.2s;
    font-size:12px;
}

.social-link:hover{
    background:var(--copper);
    color:#000;
    transform:translateY(-2px);
}

.coffee-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--text-dim);
    text-decoration:none;
    font-size:12px;
    margin-bottom:12px;
}

.coffee-link:hover{color:var(--copper)}

.copyright{
    font-size:11px;
    color:#444;
}

@media(max-width:768px){
    .player-card{
        grid-template-columns:1fr;
        padding:25px;
        gap:25px;
    }
    .cover-wrapper{
        margin:0 auto;
        width:220px;
        height:220px;
    }
    .playlists{grid-template-columns:1fr}
}
</style>
</head>

    { id:'GOD MODE: EXTENDED', name:'GOD MODE: EXTENDED', genre:'Gaming Dubstep' },
    { id:'Boneless Pressure', name:'Boneless Pressure', genre:'Ragga Dubstep' },
    { id:'Unleash the Storm', name:'Unleash the Storm', genre:'Melodic Dubstep, Crossbreed' },
    { id:'Beyond the Sky', name:'Beyond the Sky', genre:'Cyberpunk, Dubstep' }
];

const audio = document.getElementById('audio-player');
const playerCard = document.getElementById('player-card');
const btnPlay = document.getElementById('btn-play');
const playIcon = document.getElementById('play-icon');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnShuffle = document.getElementById('btn-shuffle');
const btnRepeat = document.getElementById('btn-repeat');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const volumeSlider = document.getElementById('volume-slider');

const playerTitle = document.getElementById('player-title');
const playerGenre = document.getElementById('player-genre');
const playerCover = document.getElementById('player-cover');

const waveform = document.getElementById('waveform');
const canvas = document.getElementById('wave-canvas');
const ctx = canvas.getContext('2d');

let currentPlaylist = playlistRockstep;
let currentIndex = 0;
let isShuffle = false;
let isRepeat = false;

let audioCtx = null;
let analyser = null;
let dataArray = null;
let sourceNode = null;
let isAudioInit = false;
let animationId = null;

function initAudioContext(){
    if(isAudioInit) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;

    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    dataArray = new Uint8Array(analyser.frequencyBinCount);
    isAudioInit = true;
    startWave();
}

function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
}

function drawWave(){
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if(!width || !height) return;

    ctx.clearRect(0,0,width,height);

    const bars = 60;
    const barGap = 3;
    const barWidth = (width - (bars * barGap)) / bars;
    const progress = audio.duration ? audio.currentTime / audio.duration : 0;

    if(isAudioInit && !audio.paused && analyser){
        analyser.getByteFrequencyData(dataArray);
    }

    for(let i = 0; i < bars; i++){
        let value = 0.15;
        if(isAudioInit && !audio.paused && dataArray){
            const index = Math.floor((i / bars) * dataArray.length);
            value = Math.max(0.1, dataArray[index] / 255);
        } else {
            value = Math.sin(i * 0.2) * 0.15 + 0.2;
        }

        const barHeight = value * height * 0.9;
        const x = i * (barWidth + barGap);
        const y = (height - barHeight) / 2;

        const isPlayed = (i / bars) <= progress;

        ctx.fillStyle = isPlayed ? '#e05a1d' : '#222832';
        ctx.fillRect(x, y, barWidth, barHeight);

        if(Math.abs((i / bars) - progress) < (1 / bars)){
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#e05a1d';
            ctx.shadowBlur = 8;
            ctx.fillRect(x, y - 2, barWidth, barHeight + 4);
            ctx.shadowBlur = 0;
        }
    }

    if(!audio.paused){
        animationId = requestAnimationFrame(drawWave);
    }
}

function startWave(){
    if(!animationId){
        animationId = requestAnimationFrame(drawWave);
    }
}

function stopWave(){
    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    drawWave();
}

window.addEventListener('resize', ()=>{
    resizeCanvas();
    drawWave();
});

function formatTime(seconds){
    if(!Number.isFinite(seconds)) return '00:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return (min < 10 ? '0' + min : min) + ':' + (sec < 10 ? '0' + sec : sec);
}

function setPlayingState(playing){
    playerCard.classList.toggle('is-playing', playing);
    document.getElementById('status-text').textContent = playing ? 'CORE ACTIVE' : 'CORE ONLINE';

    if(playing){
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        startWave();
    }else{
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        stopWave();
    }
}

function loadTrack(index, playlist, autoPlay = true){
    if(index < 0 || index >= playlist.length) return;

    currentPlaylist = playlist;
    currentIndex = index;

    const track = playlist[index];

    playerTitle.textContent = track.name;
    playerGenre.textContent = track.genre || 'INDUSTRIAL METAL';

    playerCover.src = track.cover || 'acm_logo.png';
    playerCover.alt = track.name;

    const url = `${WORKER_URL}/?track=${encodeURIComponent(track.id)}`;
    audio.src = url;
    audio.load();

    document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));

    const listId = playlist === playlistRockstep ? 'list-rockstep' : 'list-dubstep';
    const list = document.getElementById(listId);
    const items = list.querySelectorAll('.track-item');

    if(items[index]){
        items[index].classList.add('active');
    }

    timeCurrent.textContent = '00:00';
    timeTotal.textContent = '00:00';

    if(autoPlay){
        initAudioContext();
        audio.play().catch(e => console.log('Autoplay issue:', e));
    }else{
        setPlayingState(false);
    }
}

function togglePlay(){
    initAudioContext();
    if(audio.paused){
        audio.play().catch(e => console.log('Play issue:', e));
    }else{
        audio.pause();
    }
}

function nextTrack(){
    let next = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) : (currentIndex + 1) % currentPlaylist.length;
    loadTrack(next, currentPlaylist, true);
}

function prevTrack(){
    if(audio.currentTime > 3){
        audio.currentTime = 0;
        return;
    }
    let prev = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
    loadTrack(prev, currentPlaylist, true);
}

btnPlay.addEventListener('click', togglePlay);
audio.addEventListener('play', () => setPlayingState(true));
audio.addEventListener('pause', () => setPlayingState(false));
audio.addEventListener('ended', () => isRepeat ? (audio.currentTime = 0, audio.play()) : nextTrack());

audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    timeCurrent.textContent = formatTime(audio.currentTime);
    drawWave();
});

audio.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = formatTime(audio.duration);
});

waveform.addEventListener('click', (e) => {
    const rect = waveform.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if(audio.duration){
        audio.currentTime = Math.max(0, Math.min(1, pct)) * audio.duration;
    }
});

volumeSlider.addEventListener('input', (e) => {
    audio.volume = Number(e.target.value);
});

btnShuffle.addEventListener('click', () => {
    isShuffle = !isShuffle;
    btnShuffle.classList.toggle('active', isShuffle);
});

btnRepeat.addEventListener('click', () => {
    isRepeat = !isRepeat;
    btnRepeat.classList.toggle('active', isRepeat);
});

btnNext.addEventListener('click', nextTrack);
btnPrev.addEventListener('click', prevTrack);

function renderList(list, containerId){
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    list.forEach((track, index) => {
        const div = document.createElement('div');
        div.className = 'track-item';
        div.innerHTML = `
            <div class="track-item-name">${escapeHtml(track.name)}</div>
            <div class="track-item-meta">${escapeHtml(track.genre)}</div>
        `;
        div.addEventListener('click', () => loadTrack(index, list, true));
        container.appendChild(div);
    });
}

function escapeHtml(value){
    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

window.addEventListener('DOMContentLoaded', () => {
    applyLanguage();
    resizeCanvas();
    renderList(playlistRockstep, 'list-rockstep');
    renderList(playlistDubstep, 'list-dubstep');
    loadTrack(0, playlistRockstep, false);
    audio.volume = Number(volumeSlider.value);
});
</script>

</body>
</html>
