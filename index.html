<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACM — AI Core Mixes</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --copper: #c87f43;
    --copper-dim: #9a6234;
    --bg: #080808;
    --card: rgba(255,255,255,.045);
    --card-hover: rgba(255,255,255,.075);
    --text: #fff;
    --text-dim: #a9a9a9;
}

body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: var(--bg);
    background-image: url("acm_logo.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(8,8,8,0.85);
    z-index: -1;
}

.wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
}

.logo {
    display: block;
    width: min(360px, 80%);
    margin: 0 auto 30px;
}

/* ===== ПРОСТОЙ ПЛЕЕР ===== */
.player-container {
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--copper);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 40px;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(200,127,67,0.3);
}

.player-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--copper);
    text-transform: uppercase;
}

.core-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
}

.core-dot {
    width: 6px;
    height: 6px;
    background: var(--copper);
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.player-main {
    display: flex;
    gap: 25px;
    align-items: center;
    margin-bottom: 25px;
}

.player-cover {
    width: 180px;
    height: 180px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(200,127,67,0.3);
}

.player-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.player-info {
    flex: 1;
}

.player-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.player-genre {
    font-size: 12px;
    color: var(--copper);
    letter-spacing: 1px;
}

/* Визуализация */
.waveform {
    width: 100%;
    height: 60px;
    margin: 20px 0;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    overflow: hidden;
}

#wave-canvas {
    width: 100%;
    height: 100%;
}

/* Прогресс */
.progress-container {
    margin-bottom: 15px;
}

.progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
}

.progress-fill {
    height: 100%;
    background: var(--copper);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s;
}

.time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: monospace;
}

/* Контролы */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}

.btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 10px;
    transition: all 0.2s;
}

.btn:hover {
    color: var(--copper);
    transform: scale(1.1);
}

.btn.active {
    color: var(--copper);
}

.btn-play {
    width: 56px;
    height: 56px;
    border: 2px solid var(--copper);
    border-radius: 50%;
    color: var(--copper);
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-play:hover {
    background: rgba(200,127,67,0.1);
}

.btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

/* Громкость */
.volume-control {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
}

.volume-slider {
    width: 100px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--copper);
    border-radius: 50%;
    cursor: pointer;
}

/* Плейлисты */
.playlists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-bottom: 40px;
}

.genre-section details {
    width: 100%;
}

.genre-section summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: rgba(200,127,67,0.1);
    border: 1px solid rgba(200,127,67,0.3);
    border-radius: 8px;
    cursor: pointer;
    list-style: none;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--copper);
    margin-bottom: 15px;
}

.genre-section summary::-webkit-details-marker {
    display: none;
}

.track-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.track-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
}

.track-item:hover {
    background: var(--card-hover);
    transform: translateX(5px);
}

.track-item.active {
    background: rgba(200,127,67,0.15);
    border-left-color: var(--copper);
}

.track-item-name {
    flex: 1;
    font-weight: 600;
}

.track-item-meta {
    font-size: 11px;
    color: var(--text-dim);
}

/* Футер */
.footer {
    text-align: center;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.05);
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
}

.social-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--card);
    border: 1px solid rgba(200,127,67,0.3);
    border-radius: 25px;
    color: var(--text);
    text-decoration: none;
    transition: all 0.2s;
}

.social-link:hover {
    background: var(--copper);
    color: #000;
    transform: translateY(-2px);
}

.coffee-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 15px;
}

.coffee-link:hover {
    color: var(--copper);
}

.copyright {
    font-size: 12px;
    color: #555;
}

/* Адаптив */
@media (max-width: 768px) {
    .player-main {
        flex-direction: column;
        text-align: center;
    }
    
    .player-cover {
        width: 150px;
        height: 150px;
        margin: 0 auto;
    }
    
    .playlists {
        grid-template-columns: 1fr;
    }
    
    .volume-control {
        justify-content: center;
    }
}
</style>
</head>

<script>
// ===== ДАННЫЕ =====
const WORKER_URL = 'https://acm-audio-proxy.deniska.workers.dev';

const playlistRockstep = [

    { id: 'Glacial Ignite', name: 'Glacial Ignite', genre: 'Doom Metal, Metalstep' },
    { id: 'Ghost Chemistry', name: 'Ghost Chemistry', genre: 'Heavy Rockstep, Dark Dubstep' },
    { id: 'One Step Into The Void', name: 'One Step Into The Void', genre: 'Doom Metal, Nu-Metal' },
    { id: 'Thunder Echo', name: 'Thunder Echo', genre: 'Modern Hard Rock, Rockstep' },
    { id: 'Protocol Ghost', name: 'Protocol Ghost', genre: 'Dark Cyberpunk, Industrial Metal' },
    { id: 'Neural Fracture', name: 'Neural Fracture', genre: 'Rap, Metalcore, Doomstep' },
    { id: 'Berserks Protocol', name: 'Berserks Protocol', genre: 'Industrial Metalstep, Folk Metal' },

const playlistDubstep = [
    { id: 'Everything is OK', name: 'Everything is OK', genre: 'Ragga Dubstep' },
    { id: 'Rendezvous with Life', name: 'Rendezvous with Life', genre: 'Melodic Dubstep' },
    { id: 'Boundless Ocean', name: 'Boundless Ocean', genre: 'Melodic Dubstep' },
    { id: 'Tomorrow's Light', name: 'Tomorrow's Light', genre: 'Tribal Dubstep' },

    { id: 'Zenith', name: 'Zenith', genre: 'Melodic Dubstep, Complextro' },

    { id: 'Boneless Pressure', name: 'Boneless Pressure', genre: 'Ragga Dubstep' },
    { id: 'Unleash the Storm', name: 'Unleash the Storm', genre: 'Melodic Dubstep, Crossbreed' },
    { id: 'Beyond the Sky', name: 'Beyond the Sky', genre: 'Cyberpunk, Dubstep' }
];

// ===== ЭЛЕМЕНТЫ =====
const audio = document.getElementById('audio-player');
const btnPlay = document.getElementById('btn-play');
const playIcon = document.getElementById('play-icon');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnShuffle = document.getElementById('btn-shuffle');
const btnRepeat = document.getElementById('btn-repeat');
const progressBar = document.getElementById('progress-bar');
const progressFill = document.getElementById('progress-fill');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const volumeSlider = document.getElementById('volume-slider');
const playerTitle = document.getElementById('player-title');
const playerGenre = document.getElementById('player-genre');
const playerCover = document.getElementById('player-cover');
const canvas = document.getElementById('wave-canvas');
const ctx = canvas.getContext('2d');

let currentPlaylist = playlistRockstep;
let currentIndex = 0;
let isShuffle = false;
let isRepeat = false;
let audioCtx, analyser, dataArray;
let isInit = false;

// ===== ВИЗУАЛИЗАЦИЯ =====
function initAudioContext() {
    if (isInit) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    isInit = true;
    drawWave();
}

function drawWave() {
    const w = canvas.width = canvas.offsetWidth * 2;
    const h = canvas.height = canvas.offsetHeight * 2;
    
    if (!isInit || audio.paused) {
        ctx.clearRect(0, 0, w, h);
        // Статичная волна
        for (let i = 0; i < 50; i++) {
            const barH = Math.random() * h * 0.5 + h * 0.1;
            ctx.fillStyle = 'rgba(200,127,67,0.2)';
            ctx.fillRect(i * (w/50), (h-barH)/2, w/50-2, barH);
        }
        requestAnimationFrame(drawWave);
        return;
    }
    
    analyser.getByteFrequencyData(dataArray);
    ctx.clearRect(0, 0, w, h);
    
    const barW = w / dataArray.length * 2;
    const progress = audio.currentTime / audio.duration || 0;
    
    for (let i = 0; i < dataArray.length; i++) {
        const barH = (dataArray[i] / 255) * h;
        const x = i * barW;
        const isPlayed = x < w * progress;
        
        ctx.fillStyle = isPlayed ? '#c87f43' : 'rgba(255,255,255,0.1)';
        ctx.fillRect(x, (h-barH)/2, barW-1, barH);
    }
    
    requestAnimationFrame(drawWave);
}

// ===== УПРАВЛЕНИЕ =====
function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec<10?'0':'') + sec;
}

function loadTrack(index, playlist, autoPlay = true) {
    if (index < 0 || index >= playlist.length) return;
    currentPlaylist = playlist;
    currentIndex = index;
    const track = playlist[index];
    
    playerTitle.textContent = track.name;
    playerGenre.textContent = track.genre || '—';
    playerCover.src = 'acm_logo.png'; // Пока заглушка
    
    const url = `${WORKER_URL}/?track=${encodeURIComponent(track.id)}`;
    audio.src = url;
    
    if (autoPlay) {
        initAudioContext();
        audio.play().catch(e => console.log('Play blocked:', e));
    }
    
    // Обновляем активный трек в списке
    document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
    const listId = playlist === playlistRockstep ? 'list-rockstep' : 'list-dubstep';
    const items = document.getElementById(listId).querySelectorAll('.track-item');
    if (items[index]) items[index].classList.add('active');
}

function togglePlay() {
    if (!isInit) initAudioContext();
    if (audio.paused) audio.play();
    else audio.pause();
}

function updatePlayIcon() {
    if (audio.paused) {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }
}

function nextTrack() {
    let next = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) 
                         : (currentIndex + 1) % currentPlaylist.length;
    loadTrack(next, currentPlaylist, true);
}

function prevTrack() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }
    const prev = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
    loadTrack(prev, currentPlaylist, true);
}

// ===== СОБЫТИЯ =====
btnPlay.addEventListener('click', togglePlay);
audio.addEventListener('play', updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);
audio.addEventListener('ended', () => {
    if (isRepeat) { audio.currentTime = 0; audio.play(); }
    else nextTrack();
});

audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
    }
});

audio.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = formatTime(audio.duration);
});

progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
});

volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });

btnShuffle.addEventListener('click', () => {
    isShuffle = !isShuffle;
    btnShuffle.classList.toggle('active', isShuffle);
});

btnRepeat.addEventListener('click', () => {
    isRepeat = !isRepeat;
    btnRepeat.classList.toggle('active', isRepeat);
});

btnNext.addEventListener('click', nextTrack);
btnPrev.addEventListener('click', prevTrack);

// ===== РЕНДЕР СПИСКОВ =====
function renderList(list, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    list.forEach((track, i) => {
        const div = document.createElement('div');
        div.className = 'track-item';
        div.innerHTML = `
            <div class="track-item-name">${track.name}</div>
            <div class="track-item-meta">${track.genre}</div>
        `;
        div.addEventListener('click', () => loadTrack(i, list, true));
        container.appendChild(div);
    });
}

// ===== СТАРТ =====
window.addEventListener('DOMContentLoaded', () => {
    renderList(playlistRockstep, 'list-rockstep');
    renderList(playlistDubstep, 'list-dubstep');
    loadTrack(0, playlistRockstep, false);
    drawWave();
});
</script>
