<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Mixes (ACM)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            min-height: 100vh;
            background: #0a0a0a;
            user-select: none;
        }
        
        /* Размытый фон */
        .bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('cover1.jpg') center/cover;
            filter: blur(30px) brightness(0.4);
            z-index: -1;
            transition: background 0.8s ease;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }
        
        /* Главный плеер */
        .player {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .player-cover {
            width: 280px;
            max-width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }
        
        .player-title {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }
        
        .player-desc {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        audio {
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
        }
        
        /* Список треков */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .track {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .track:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        
        .track.active {
            background: rgba(255,255,255,0.15);
            border-left: 3px solid #fff;
        }
        
        .track-cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .track-info {
            flex: 1;
            min-width: 0;
        }
        
        .track-name {
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .track-genre {
            font-size: 0.8rem;
            color: #888;
        }
        
        .track-duration {
            color: #666;
            font-size: 0.85rem;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
        }
        
        .footer a {
            color: #888;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .footer a:hover { color: #fff; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="bg" id="bg"></div>
    
    <div class="container">
        <h1>AI CORE MIXES</h1>
        <p class="subtitle">Независимая электронная музыка • Doom Metal / Dubstep / Rockstep</p>
        
        <!-- Главный плеер -->
        <div class="player">
            <img id="mainCover" class="player-cover" src="cover1.jpg" alt="Cover">
            <h2 id="mainTitle" class="player-title">Выберите трек</h2>
            <p id="mainDesc" class="player-desc">Нажмите на любой трек из списка ниже, чтобы начать прослушивание</p>
            <audio id="audioPlayer" controls>
                <source id="audioSource" src="" type="audio/mpeg">
            </audio>
        </div>
        
        <!-- Список треков -->
        <div class="track-list" id="trackList">
            <!-- Треки добавляются через JavaScript ниже -->
        </div>
        
        <div class="footer">
            <p>© 2026 XaHTeP7 • Все треки распространяются бесплатно в некоммерческих целях</p>
            <p style="margin-top: 10px;">
                <a href="https://youtube.com/@XaHTeP7" target="_blank">YouTube</a>
                <a href="https://t.me/ваш_канал" target="_blank">Telegram</a>
            </p>
        </div>
    </div>

    <script>
        // ===== ЗДЕСЬ ДОБАВЛЯЙТЕ СВОИ ТРЕКИ =====
        const tracks = [
            {
                name: "Название первого трека [ACM]",
                genre: "Doom Metal / Dubstep",
                duration: "4:32",
                cover: "cover1.jpg",
                audio: "track1.mp3",
                desc: "Описание концепции первого трека. Что вдохновило, какие элементы использованы, атмосфера."
            },
            {
                name: "Название второго трека [ACM]",
                genre: "Heavy Rockstep",
                duration: "5:15",
                cover: "cover2.jpg",
                audio: "track2.mp3",
                desc: "Описание второго трека. История создания, настроение, особенности."
            },
            {
                name: "Название третьего трека [ACM]",
                genre: "Dubstep",
                duration: "3:48",
                cover: "cover3.jpg",
                audio: "track3.mp3",
                desc: "Описание третьего трека."
            }
            // Чтобы добавить новый трек, скопируйте блок {...} выше и вставьте сюда
        ];
        // ===== КОНЕЦ СПИСКА ТРЕКОВ =====

        const trackList = document.getElementById('trackList');
        const mainCover = document.getElementById('mainCover');
        const mainTitle = document.getElementById('mainTitle');
        const mainDesc = document.getElementById('mainDesc');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const bg = document.getElementById('bg');

        // Создаём список треков
        tracks.forEach((track, index) => {
            const div = document.createElement('div');
            div.className = 'track';
            div.innerHTML = `
                <img src="${track.cover}" class="track-cover" alt="">
                <div class="track-info">
                    <div class="track-name">${track.name}</div>
                    <div class="track-genre">${track.genre}</div>
                </div>
                <div class="track-duration">${track.duration}</div>
            `;
            div.onclick = () => playTrack(index);
            trackList.appendChild(div);
        });

        function playTrack(index) {
            const track = tracks[index];
            mainCover.src = track.cover;
            bg.style.backgroundImage = `url('${track.cover}')`;
            mainTitle.textContent = track.name;
            mainDesc.textContent = track.desc;
            audioSource.src = track.audio;
            audioPlayer.load();
            audioPlayer.play();
            
            // Подсветка активного трека
            document.querySelectorAll('.track').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }
    </script>
</body>
</html>
